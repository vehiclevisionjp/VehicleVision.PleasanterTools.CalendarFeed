apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "calendarfeed.fullname" . }}
  labels:
    {{- include "calendarfeed.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
