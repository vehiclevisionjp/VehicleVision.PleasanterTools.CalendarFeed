# 端から端まで通す試験（Pleasanter・Keycloak の実機を起動する）。Issue #45。
#
# **管理画面のログイン（Pleasanter のログイン・SAML）と、Pleasanter からの取得は、実機でしか確かめられない。**
# 手元で通すだけだと、依存ライブラリ（ITfoxtec など）や Pleasanter の更新で壊れても気づけない。
# 書き方は Questionnaire の e2e.yml に倣った。
#
# **Pleasanter 本体（AGPL v3）・Keycloak は公式イメージを起動するだけ。**
# ソースの参照・コピー・リンク・プロジェクト参照はしない。ここで起動するのは「相手方の実機」であって、
# 本製品の一部ではない（_reference/README.md と同じ立て付け）。
#
# **相手方の版は固定する**（Pleasanter は tools/pleasanter-testenv、Keycloak は tools/saml-idp の docker-compose.yml）。
# 最新に追随させると、壊れた原因が自分の変更か相手の更新かを切り分けられなくなる。
#
# **ドキュメントだけの PR では回さない**（下の paths）。
name: E2E Tests

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
    # **振る舞いが変わり得るものだけ。** ドキュメントや Issue テンプレートでは回さない
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "Directory.Build.props"
      - "global.json"
      - ".github/workflows/e2e.yml"
  schedule:
    # 毎日 03:00 JST（UTC では前日 18:00）。相手方の実機は版を固定しているが、ベースイメージや依存の更新で壊れていないかを見る
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  # **検証環境用の固定値。** 本番の資格情報ではない（tools/pleasanter-testenv の既定と同じ）
  TESTENV_SA_PASSWORD: Calendarfeed#Test1
  TESTENV_API_KEY: 6ce6c0fd2f4aea3c093c3ebdd7d4ea3250a132b4867d68e7d1abe35c2499664abb398d74603c2b2a38e31a21319955b3c43ede30394ead7be37ddd615c34e1f6

jobs:
  pleasanter:
    name: e2e / pleasanter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ソースを取得する
        uses: actions/checkout@v7
        with:
          # **Pleasanter のソースは要らない。** 起動するのは公式イメージ
          submodules: false

      - name: .NET SDK を用意する
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pleasanter を起動する
        # CodeDefiner は「走り切って終了する」係。compose の depends_on: service_completed_successfully が順序を持っている
        working-directory: tools/pleasanter-testenv
        run: |
          set -euo pipefail
          docker compose up -d --wait db codedefiner pleasanter

      - name: 検証用の API キーと利用者を入れる
        working-directory: tools/pleasanter-testenv
        run: |
          set -euo pipefail
          for seed in 01_apikey 02_sso_users; do
              docker compose cp "seed/${seed}.sql" db:/tmp/
              docker compose exec -T db /opt/mssql-tools18/bin/sqlcmd \
                  -S localhost -U sa -P "$TESTENV_SA_PASSWORD" -C -b -i "/tmp/${seed}.sql"
          done
          # 利用者の情報はキャッシュされるので、入れ替えたら再起動して捨てる。
          # ⚠️ **`up --wait` をやり直さない**（CodeDefiner が走り直し、起動中の Pleasanter の DB 接続を巻き込む）。再起動だけして、応答を待つ
          docker compose restart pleasanter
          # **ポートが開いただけでは、まだ API が 503 を返す**（healthcheck は TCP の待ち受けだけを見る。起動の最後に暖機がある）。
          # ログイン画面が 200 を返すまで待つ（実行の遅い環境でも足りるよう 5 分）
          code=000
          for i in $(seq 1 150); do
              code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18090/users/login || true)"
              [ "$code" = "200" ] && break
              sleep 2
          done
          [ "$code" = "200" ] || { echo "::error title=Pleasanter did not become ready::last status $code"; exit 1; }

      - name: Pleasanter からの取得を通す
        working-directory: tools/pleasanter-testenv
        run: docker compose run --rm verify

      - name: 本アプリを組み立てて起動する
        run: |
          set -euo pipefail
          dotnet build src/VehicleVision.PleasanterTools.CalendarFeed.Web -c Release
          web=src/VehicleVision.PleasanterTools.CalendarFeed.Web
          export CALENDARFEED_SECRET_KEY="$(dotnet run --no-build -c Release --project "$web" -- --generate-secret-key | tail -1)"
          export CALENDARFEED_DB_CONNECTIONSTRING="Data Source=${RUNNER_TEMP}/e2e.db"
          export ASPNETCORE_URLS=http://localhost:5099
          export CALENDARFEED_PLEASANTER_BASEURL=http://localhost:18090
          export CALENDARFEED_PLEASANTER_APIKEY="$TESTENV_API_KEY"
          nohup dotnet run --no-build -c Release --project "$web" > "${RUNNER_TEMP}/app.log" 2>&1 &
          for i in $(seq 1 60); do
              curl -fsS http://localhost:5099/admin/api/status > /dev/null && break
              sleep 1
          done
          curl -fsS -X POST http://localhost:5099/admin/api/setup \
              -H 'Content-Type: application/json' \
              -d '{"loginId":"sso-e2e-plain","password":"Sso-e2e-admin-password-1"}'

      - name: Pleasanter のログインを通す
        # 再検証の間隔（1 分）を過ぎるまで待つので、1 分余りかかる
        run: python3 tools/pleasanter-testenv/sso_roundtrip.py

      - name: 本アプリのログを残す
        if: always()
        run: |
          echo "::group::app.log"
          cat "${RUNNER_TEMP}/app.log" || true
          echo "::endgroup::"

      - name: Pleasanter のログを残す
        if: failure()
        working-directory: tools/pleasanter-testenv
        # スタックトレースの行（at …）は除く。起動の流れとエラーの文面を残す
        run: docker compose logs --no-color --timestamps pleasanter | grep -vE "\|\s+at " | tail -150

      - name: 後片付け
        if: always()
        working-directory: tools/pleasanter-testenv
        run: docker compose down -v

  saml:
    name: e2e / saml
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ソースを取得する
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: .NET SDK を用意する
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Keycloak を起動する
        run: docker compose -f tools/saml-idp/docker-compose.yml up -d --wait

      - name: 本アプリを組み立てて HTTPS で起動する
        # Keycloak のログインの途中の cookie は Secure 付きなので、本アプリも HTTPS で立てる（証明書は検証用の自己署名）
        run: |
          set -euo pipefail
          dotnet build src/VehicleVision.PleasanterTools.CalendarFeed.Web -c Release
          web=src/VehicleVision.PleasanterTools.CalendarFeed.Web
          export CALENDARFEED_SECRET_KEY="$(dotnet run --no-build -c Release --project "$web" -- --generate-secret-key | tail -1)"
          export CALENDARFEED_DB_CONNECTIONSTRING="Data Source=${RUNNER_TEMP}/e2e-saml.db"
          export CALENDARFEED_PUBLIC_BASEURL=https://localhost:8443
          export ASPNETCORE_URLS=https://localhost:8443
          export Kestrel__Certificates__Default__Path="${GITHUB_WORKSPACE}/tools/saml-idp/tls/cert.pem"
          export Kestrel__Certificates__Default__KeyPath="${GITHUB_WORKSPACE}/tools/saml-idp/tls/key.pem"
          nohup dotnet run --no-build -c Release --project "$web" > "${RUNNER_TEMP}/app-saml.log" 2>&1 &
          for i in $(seq 1 60); do
              curl -fsSk https://localhost:8443/admin/api/status > /dev/null && break
              sleep 1
          done
          curl -fsSk -X POST https://localhost:8443/admin/api/setup \
              -H 'Content-Type: application/json' \
              -d '{"loginId":"admin@example.jp","password":"Saml-e2e-admin-password-1"}'

      - name: SAML のログインを通す
        run: python3 tools/saml-idp/e2e.py

      - name: 本アプリのログを残す
        if: always()
        run: |
          echo "::group::app-saml.log"
          cat "${RUNNER_TEMP}/app-saml.log" || true
          echo "::endgroup::"

      - name: Keycloak のログを残す
        if: failure()
        run: docker compose -f tools/saml-idp/docker-compose.yml logs --no-color | tail -200

      - name: 後片付け
        if: always()
        run: docker compose -f tools/saml-idp/docker-compose.yml down -v

  # CalDAV の実クライアント（Python の caldav・vdirsyncer）を、本アプリ（コンテナ）と実機の Pleasanter で通す。
  # **本アプリの DB は 4 種（SQLite・SQL Server・PostgreSQL・MySQL）すべてで**通す（DB=all。約 5 分）。
  # **必須チェックにはしていない**（実クライアントの版が変わって落ちることがある。気づくための仕掛け）。
  # 必須にするときは、e2e-skip.yml に同名のジョブを足すこと
  caldav:
    name: e2e / caldav
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ソースを取得する
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: 実クライアントで CalDAV を通す（DB 4 種）
        run: DB=all bash tools/caldav-check/run.sh
