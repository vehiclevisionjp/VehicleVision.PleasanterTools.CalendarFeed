# 開発環境ひとそろい（Questionnaire の compose.yaml に倣った）。
#
# **ホストに .NET SDK も node も要求しない**ことが目的。
# Pleasanter（検証環境）と本アプリをまとめて起動する。
#
# Pleasanter 側の定義は tools/pleasanter-testenv/docker-compose.yml を include して
# 再利用する（二重管理しないため）。そちらの service 名は db / codedefiner / pleasanter / verify。
# `db` は SQL Server（Pleasanter 用）。
#
#   起動:      docker compose up -d --wait
#   画面:      http://localhost:8081/admin（初回は初期設定の画面）
#   後片付け:  docker compose down -v
#
# **秘密の値は、このファイルへ書かず環境変数で渡す**（未設定だと起動前に止まる）。
#   DEV_SECRET_KEY  : API キーを DB で守る鍵。`openssl rand -base64 32` か
#                     `dotnet run --project src/VehicleVision.PleasanterTools.CalendarFeed.Web -- --generate-secret-key` で作る
#   TESTENV_API_KEY : 検証用 Pleasanter の API キー（tools/pleasanter-testenv/docker-compose.yml の verify の値）
#
# **本アプリの DB は既定で SQLite（ボリューム）。** SQL Server / PostgreSQL / MySQL へ向けるときは
# DEV_DB_PROVIDER と DEV_DB_CONNECTIONSTRING を指定する。
# **tools/pleasanter-testenv を同時に起動しないこと。** ポートが衝突する。
#
# **Windows の Git Bash からは MSYS_NO_PATHCONV=1 を付けること。**

name: calendarfeed-dev

include:
  - path: tools/pleasanter-testenv/docker-compose.yml

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      pleasanter:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # **Azure の実行環境は既定 UTC。** 明示しないと日時が 9 時間ずれる
      TZ: Asia/Tokyo
      CALENDARFEED_DB_PROVIDER: ${DEV_DB_PROVIDER:-Sqlite}
      CALENDARFEED_DB_CONNECTIONSTRING: ${DEV_DB_CONNECTIONSTRING:-Data Source=/data/calendarfeed.db}
      CALENDARFEED_PLEASANTER_BASEURL: http://pleasanter:8080
      CALENDARFEED_PLEASANTER_APIKEY: ${TESTENV_API_KEY:?TESTENV_API_KEY を設定すること（先頭のコメント参照）}
      # **これを失うと、登録済みの API キーが全て使えなくなる。** 本番では App Service の設定か Key Vault に置き、控えを取る
      CALENDARFEED_SECRET_KEY: ${DEV_SECRET_KEY:?DEV_SECRET_KEY を設定すること（先頭のコメント参照）}
    volumes:
      - app-data:/data
    ports:
      - "${DEV_APP_PORT:-8081}:8080"
    healthcheck:
      # aspnet イメージには curl / wget が無いため、bash の /dev/tcp で待受を確認する
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  app-data:
